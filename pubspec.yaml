name: les_etoiles_movil
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.0
## dependencias para el proyecto
dependencies:
  flutter:
    sdk: flutter
  http: ^1.1.0
  google_fonts: ^6.3.2
  shared_preferences: ^2.2.2
  cupertino_icons: ^1.0.8
## dependencias para desarrollo y pruebas
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

## Flutter Configuration para assets
flutter:
  uses-material-design: true
  assets:
    - lib/assets/images/

## Flutter Launcher Icons Configuration

flutter_icons:
  android: true
  ios: true
  image_path: "lib/assets/images/LogoPlayaAzul.png"
  adaptive_icon_foreground: "lib/assets/images/LogoPlayaAzul.png"
  adaptive_icon_background: "#FFFFFF"

